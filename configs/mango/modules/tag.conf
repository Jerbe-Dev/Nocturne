# Every tag (1-9) exists on every monitor
# Customize layout per tag per monitor by editing below
#
# Available layouts: tile, scroller, grid, deck, monocle, center_tile,
#                    vertical_tile, right_tile, vertical_scroller,
#                    vertical_grid, vertical_deck, tgmix
#
# Format: tagrule=id:<tag_id>,monitor_name:<monitor>,layout_name:<layout>

# Set Master-Stack layout on all workspaces (tags 1 through 9)
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile
