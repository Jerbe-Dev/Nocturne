# Firefox Picture-in-Picture -> Open Floating
windowrule=isfloating:1,appid:firefox,title:^Picture-in-Picture$

# Noctalia Settings -> Floating with Fixed Width (850px) & Height (700px)
windowrule=isfloating:1,width:850,height:700,appid:dev.noctalia.Noctalia

# Privacy Shielding (Block screen capture for KeepassXC & Secrets)
windowrule=shield_when_capture:1,appid:org.keepassxc.KeePassXC
windowrule=shield_when_capture:1,appid:org.gnome.World.Secrets
