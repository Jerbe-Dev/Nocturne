# --- Noctalia Binds ---
bind=SUPER,L,spawn,noctalia msg session lock
bind=SUPER,comma,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER,period,spawn,noctalia msg panel-toggle launcher "/emo "
bind=SUPER,V,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,D,spawn,noctalia msg panel-toggle control-center
bind=ALT,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,N,spawn,noctalia msg panel-toggle control-center notifications
bind=SUPER,Escape,spawn,noctalia msg panel-toggle session
bind=SUPER+ALT,I,spawn,noctalia msg settings-toggle
bind=ALT,Tab,spawn,noctalia msg window-switcher

# --- Apps ---
bind=SUPER,T,spawn,kitty
bind=SUPER,B,spawn,helium-browser
bind=SUPER,E,spawn,thunar
bind=SUPER,M,spawn,spotify
bind=SUPER,O,spawn,obsidian
bind=SUPER,C,spawn,vscodium

# --- Window & Overview Actions ---
bind=SUPER,Q,killclient
bind=SUPER,Tab,toggleoverview

# --- Focusing Windows ---
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# --- Moving / Swapping Windows ---
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right

bind=SUPER+SHIFT,H,exchange_client,left
bind=SUPER+SHIFT,J,exchange_client,down
bind=SUPER+SHIFT,K,exchange_client,up
bind=SUPER+SHIFT,L,exchange_client,right

# --- Focusing Monitors ---
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Down,focusmon,down
bind=SUPER+CTRL,Up,focusmon,up
bind=SUPER+CTRL,Right,focusmon,right

# --- Moving Windows to Monitors ---
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Down,tagmon,down
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Right,tagmon,right

bind=SUPER+SHIFT+CTRL,H,tagmon,left
bind=SUPER+SHIFT+CTRL,J,tagmon,down
bind=SUPER+SHIFT+CTRL,K,tagmon,up
bind=SUPER+SHIFT+CTRL,L,tagmon,right

# --- Workspace (Tag) Management ---
# View Workspaces 1-9
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# Move Window to Workspace 1-9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# --- Floating & Fullscreen Controls ---
bind=SUPER+CTRL,V,togglefloating
bind=SUPER,F,togglefullscreen

# --- Screenshots ---
bind=NONE,Print,spawn_shell,grim ~/Pictures/Screenshots/"Screenshot from $(date +'%Y-%m-%d %H-%M-%S').png"
bind=CTRL,Print,spawn_shell,grim - | wl-copy
bind=ALT,Print,spawn_shell,grim -g "$(slurp)" ~/Pictures/Screenshots/"Screenshot from $(date +'%Y-%m-%d %H-%M-%S').png"

# --- Audio Controls (Allow when locked: bindl) ---
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ -l 1.0
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# --- Media Controls ---
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioStop,spawn,playerctl stop
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioNext,spawn,playerctl next

# --- Brightness Controls ---
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +10%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 10%-

# --- Exit and Reload WM ---
bind=SUPER+ALT,R,reload_config
bind=CTRL+ALT,Delete,quit
